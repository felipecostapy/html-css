<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>tabela</title>
     <style>
          body{
               font-family: Arial, Helvetica, sans-serif;
          }

          table{
               border-collapse: collapse;
               margin: auto;

               
          }
          th, td{
               border: 2px solid black;
               padding: 5px
          }

          thead{
               background-color: rgb(129, 125, 125);
          }

          .divisao{
               background-color: rgb(129, 125, 125);
               text-align: left;
          }

     </style>
</head>
<body>
     <table>
          <thead>
               <tr>
                    <th rowspan="2" scope="col">Area</th>
                    <th rowspan="2" scope="row">Disciplinas</th>
                    <th colspan="2" scope="colgroup">Notas</th>
                    <th rowspan="2" scope="row">Media</th>
               </tr>
               <tr>
                    <th scope="row">Nota 1</th>
                    <th scope="row">Nota 2</th>
               </tr>
          </thead>   

          <tbody>
               <tr>
                    <th rowspan="4" scope="rowgroup">EXATAS</th>
                    <td>Matemática</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
               </tr>
               <tr>
                    <td>Física</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
               </tr>
               <tr>
                    <td>Química</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
               </tr>
               <tr>
                    <td>Biologia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
               </tr>
               <tr>
                    <th colspan="4" scope="row" class="divisao">Média de Exatas</th>
                    <td class="divisao">0.0</td>
               </tr>
               <tr>
                    <th rowspan="2" scope="rowgroup">Humanas</th>
                    <td>História</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
               </tr>
               <tr>
                    <td>Geografia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
               </tr>
               <tr>
                    <th colspan="4" scope="row" class="divisao">Média de Humanas</th>
                    <td class="divisao">0.0</td>
               </tr>
          </tbody>
     </table>
</body>
</html>
