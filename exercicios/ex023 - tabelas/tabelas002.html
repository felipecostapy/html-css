<!DOCTYPE html>
<html lang="pt-br">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Tabelas grande</title>

     <style>
          body{
               font-family: arial;
          }

          table{
               width: 450px;
               border-collapse: collapse;
               margin: auto;
          }

          td, th{
               border: 1px solid black;
               padding: 10px;
          }

          thead, tfoot{
               background-color: gray;
               color: white;
          }

          td.num{
               text-align: right;
          }
     </style>
</head>
<body>
     <h1>Uso de tabelas grandes</h1>
     <!--
     ANATOMIA PARA TABELAS GRANDES
     TABLE
          HEAD
               TR, TD, TH
          TBODY
               TR, TD, TH
          TFOOT
               TR, TD, TH
          
     -->
     <table>
          <thead>
               <tr>
                    <th>Estado</th>
                    <th>População</th>
               </tr>
          </thead>
          <tbody>
               <tr>
                    <td>
                         São Paulo
                    </td>
                    <td class="num">
                         46 081 801	 
                    </td>
               </tr>
               <tr>
                    <td>
                         Minas Gerais
                    </td>
                    <td class="num">
                         21 393 441	 
                    </td>
               </tr>
               <tr>
                    <td>
                         Rio de Janeiro
                    </td>
                    <td class="num">
                         17 223 547	 
                    </td>
               </tr>
               <tr>
                    <td>
                         Bahia
                    </td>
                    <td class="num">
                         14 870 907	 
                    </td>
               </tr>
               <tr>
                    <td>
                         Paraná
                    </td>
                    <td class="num">
                         11 890 517	 
                    </td>
               </tr>
               <tr>
                    <td>
                         Rio Grande do Sul
                    </td>
                    <td class="num">
                         11 233 263	 
                    </td>
               </tr>
          </tbody>
          <tfoot>
               <tr>
                    <th>Total de Habitantes</th>
                    <td><strong>213 421 037</strong></td>
               </tr>
          </tfoot>
     </table>
</body>
</html>
