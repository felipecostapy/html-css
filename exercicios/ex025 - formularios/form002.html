<!DOCTYPE html>
<html lang="pt-br">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
</head>
<body>
     <h1>Teste de Formulário</h1>
     <form action="" method="post" autocomplete="on">
          <p>
               <label for="iuser">Usuário:</label>
               <input type="text" name="user" id="iuser" required minlength="5" maxlength="16" size="10" placeholder="Username" autocomplete="username">
          </p>
          <p>
               <label for="isenha">Senha:</label>
               <input type="password" name="senha" id="isenha" required minlength="8" autocomplete="current-password">
          </p>
          <p>
               <input type="submit" value="Enviar">
               <input type="reset" value="Limpar">
          </p>
     </form>
</body>
</html>
