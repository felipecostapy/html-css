<!DOCTYPE html>
<html lang="pt-br">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Formulario</title>
</head>
<body>
     <h1>Teste de Formulario</h1>
     <form action="" method="get" autocomplete="on">
          <p>
               <label for="inome">Nome:</label>
               <input placeholder="Nome completo" type="text" name="Nome" id="inome" required minlength="10">
          </p>
          <p>
               <label for="imedia">Media:</label>
               <input type="number" name="media" id="imedia" min="0" max="10" placeholder="0 a 10" step="0.1">
          </p>
          <p>
               <label for="imes">Periodo Letivo:</label>
               <input type="month" name="mes" id="imes">
          </p>
          <p>
               <label for="idata-prova">Data da Prova:</label>
               <input type="date">
          </p>
          <p>
               <label for="i-hora">Horario da prova:</label>
               <input type="time" name="hora" id="ihora">
          </p>
          <p>
               <input type="submit" value="Enviar">
               <input type="reset" value="Limpar">
          </p>



     </form>
</body>
</html>
