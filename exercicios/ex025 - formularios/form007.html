<!DOCTYPE html>
<html lang="pt-br">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Formulario</title>
</head>
<body>
     <h1>Exemplo de Form</h1>
      <form action="" method="post" autocomplete="on">

          <p>
               <label for="iest">Estado</label>
               <select name="estado" id="iest">
                    <option value="Esc">----ESCOLHA-----</option>
                    <optgroup label="Regiao Sudeste">
                         <option value="SP">Sao Paulo</option>
                         <option value="MG">Minas Gerais</option>
                    </optgroup>

                    <optgroup label="Regiao Nordeste">
                         <option value="BA">Bahia</option>
                         <option value="SE">Sergipe</option>
                    </optgroup>
               </select>
          </p>

          <p>
               <label for="iprof">Profissão:</label>
               <input type="text" name="prof" id="iprof" list="list-prof">
               <datalist id="list-prof">
                    <option value="adm">administrador</option>
                    <option value="jorn">jornalista</option>
                    <option>administrador</option>
                    <option value="adm">administrador</option>
               </datalist>
          </p>

          <p>
               <label for="imsg">Mensagem:</label>
               <textarea name="msg" id="imsg" cols="3" rows="4"></textarea>
          </p>

         <p>
          <input type="submit" value="Enviar">
          <input type="reset" value="Limpar">
         </p> 

     </form>
</body>
</html>
